<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספריית הלינקים של עומרי</title>
<meta name="description" content="לינקים ששמרתי: מדריכים, כלים ודברים שווים לחזור אליהם.">
<meta property="og:title" content="ספריית הלינקים של עומרי">
<meta property="og:description" content="לינקים ששמרתי: מדריכים, כלים ודברים שווים לחזור אליהם.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔖</text></svg>">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--muted:#6b6a64;--line:#e4e2da;--accent:#1f6f5c;--chip:#eef3f1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header h1{font-size:1.45rem;margin:0 0 2px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.92rem}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 0 10px;margin-top:8px}
#q{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--muted);font-size:.82rem;margin:6px 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:1.05rem;margin:0 0 4px;line-height:1.35}
.card h2 a{color:var(--ink);text-decoration:none}
.card h2 a:hover{color:var(--accent)}
.desc{margin:0 0 8px;color:#3a3935;font-size:.94rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.8rem;color:var(--muted)}
.meta .t{background:var(--chip);color:var(--accent);padding:1px 8px;border-radius:999px}
.url{display:block;margin-top:8px;font-size:.8rem;color:var(--accent);direction:ltr;text-align:right;overflow-wrap:anywhere;text-decoration:none}
.empty{color:var(--muted);text-align:center;padding:30px 0}
footer{margin-top:28px;color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9b9a93;--line:#2e2d2a;--accent:#5fbfa3;--chip:#20302b}.desc{color:#cfcdc6}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔖 ספריית הלינקים</h1>
    <p>מדריכים, כלים ודברים ששווה לחזור אליהם.</p>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="חיפוש לפי כותרת, תיאור או תגית" autocomplete="off" aria-label="חיפוש">
    <div class="tags" id="tags"></div>
  </div>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <footer>נשמר ע״י ראול</footer>
</div>
<script>
(async function(){
  const list=document.getElementById('list'),tagsEl=document.getElementById('tags'),q=document.getElementById('q'),count=document.getElementById('count');
  let data=[];let active=null;
  try{data=await (await fetch('links.json',{cache:'no-cache'})).json();}catch(e){list.innerHTML='<li class="empty">לא הצלחתי לטעון את הרשימה.</li>';return;}
  data.sort((a,b)=>b.saved.localeCompare(a.saved));
  const fmt=d=>{const [y,m,day]=d.split('-');return +day+'.'+(+m)+'.'+y;};
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const allTags=[...new Set(data.flatMap(x=>x.tags||[]))].sort((a,b)=>a.localeCompare(b,'he'));
  function drawTags(){
    tagsEl.innerHTML=['הכל',...allTags].map(t=>{const on=(t==='הכל'&&!active)||t===active;return `<button class="tag" type="button" aria-pressed="${on}" data-t="${esc(t)}">${esc(t)}</button>`}).join('');
  }
  function draw(){
    const s=q.value.trim().toLowerCase();
    const rows=data.filter(x=>(!active||(x.tags||[]).includes(active))&&(!s||[x.title,x.description,x.author,x.url,...(x.tags||[])].join(' ').toLowerCase().includes(s)));
    count.textContent=rows.length===data.length?`${data.length} לינקים`:`${rows.length} מתוך ${data.length}`;
    list.innerHTML=rows.length?rows.map(x=>`<li class="card">
      <h2><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h2>
      <p class="desc">${esc(x.description||'')}</p>
      <div class="meta">${x.author?`<span>${esc(x.author)}</span>`:''}<span>נשמר ${fmt(x.saved)}</span>${(x.tags||[]).map(t=>`<span class="t">${esc(t)}</span>`).join('')}</div>
      <a class="url" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(host(x.url)+new URL(x.url).pathname.replace(/\/$/,''))}</a>
    </li>`).join(''):'<li class="empty">אין תוצאות</li>';
  }
  tagsEl.addEventListener('click',e=>{const b=e.target.closest('.tag');if(!b)return;const t=b.dataset.t;active=(t==='הכל'||t===active)?null:t;drawTags();draw();});
  q.addEventListener('input',draw);
  drawTags();draw();
})();
</script>
</body>
</html>
